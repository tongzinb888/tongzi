<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐒猴子币超级抽奖系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a103d 0%, #2b1b5e 50%, #442880 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 礼花粒子容器 */
        #firework-container {
            position: fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            pointer-events: none;
            z-index:999;
        }

        .glass-card {
            width: 100%;
            max-width: 460px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 24px;
            padding: 36px 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        h1 {
            text-align: center;
            color:#ffffff;
            font-size:28px;
            letter-spacing:2px;
            margin-bottom:24px;
            text-shadow: 0 0 12px #c060ff88;
        }

        .balance-wrap {
            text-align:center;
            margin-bottom:28px;
        }
        .balance-label {
            color:#cccccc;
            font-size:16px;
        }
        .balance-num {
            font-size:36px;
            font-weight:bold;
            color:#ffdd44;
            text-shadow: 0 0 18px #ffbc00;
        }

        button {
            width:100%;
            padding:16px;
            border:none;
            border-radius:14px;
            font-size:17px;
            font-weight:600;
            cursor:pointer;
            transition: all 0.25s ease;
            margin:10px 0;
        }

        .btn-get {
            background: linear-gradient(90deg,#ff9500,#ffbc2c);
            color:#111;
            box-shadow:0 4px 16px #ff990055;
        }
        .btn-get:hover {
            transform: translateY(-3px);
            box-shadow:0 6px 22px #ff990070;
        }

        .btn-lottery {
            background: linear-gradient(90deg,#912cdf,#d044ff);
            color:#fff;
            box-shadow:0 4px 18px #a02cff55;
        }
        .btn-lottery:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow:0 6px 24px #b030ff77;
        }
        .btn-lottery:disabled {
            background:#444455;
            color:#888;
            cursor:not-allowed;
            transform:none;
            box-shadow:none;
        }

        /* 抽奖抖动动画 */
        @keyframes lotteryShake {
            0% { transform: translate(-6px,-2px); }
            25% { transform: translate(6px,2px); }
            50% { transform: translate(-6px,2px); }
            75% { transform: translate(6px,-2px); }
            100% { transform: translate(-6px,-2px); }
        }
        .shake-running {
            animation: lotteryShake 0.22s infinite;
        }

        /* 中奖弹出放大 */
        @keyframes prizeBounce {
            0% { transform: scale(0.4); opacity:0; }
            60% { transform: scale(1.25); }
            100% { transform: scale(1); opacity:1; }
        }
        .prize-item {
            animation: prizeBounce 0.7s ease-out;
            color:#ffdd55;
            font-weight:bold;
            font-size:17px;
            margin:4px 0;
        }
        .normal-log {
            color:#dddddd;
            margin:3px 0;
        }

        .divider {
            height:1px;
            background: linear-gradient(90deg,transparent,#ffffff33,transparent);
            margin:24px 0;
        }
        .tip-text {
            text-align:center;
            color:#aaa;
            font-size:14px;
            margin-bottom:12px;
        }

        .log-container {
            margin-top:24px;
            border:1px solid rgba(255,255,255,0.12);
            border-radius:14px;
            padding:16px;
            min-height:140px;
            max-height:220px;
            overflow-y:auto;
            background:rgba(0,0,0,0.25);
        }
        .log-container::-webkit-scrollbar {
            width:5px;
        }
        .log-container::-webkit-scrollbar-thumb {
            background:#6644aa;
            border-radius:4px;
        }
    </style>
</head>
<body>
<div id="firework-container"></div>

<div class="glass-card">
    <h1>🐒猴子币抽奖</h1>
    <div class="balance-wrap">
        <div class="balance-label">猴子币余额</div>
        <div class="balance-num" id="coinCount">0</div>
    </div>

    <button class="btn-get" id="gainBtn">✨点击获取 1 枚猴子币</button>

    <div class="divider"></div>
    <div class="tip-text">🎲抽奖消耗：1 猴子币</div>
    <button class="btn-lottery" id="lotteryBtn">开始超级抽奖</button>

    <div class="log-container" id="logBox"></div>
</div>

<script>
// 奖品列表
const prizeList = ["mj", "狗屎", "特啷浦的裤衩"];

let coins = Number(localStorage.getItem("monkeyCoinLotteryV2")) || 0;
const coinDom = document.getElementById("coinCount");
const gainBtn = document.getElementById("gainBtn");
const lotteryBtn = document.getElementById("lotteryBtn");
const logBox = document.getElementById("logBox");
const fireworkBox = document.getElementById("firework-container");

// sleep工具
function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

// 更新界面
function updateUI() {
    coinDom.innerText = coins;
    lotteryBtn.disabled = coins < 1;
    localStorage.setItem("monkeyCoinLotteryV2", coins);
}

// 生成礼花粒子
function createFirework(){
    const count = 60;
    for(let i=0;i<count;i++){
        const particle = document.createElement("div");
        particle.style.position = "absolute";
        particle.style.width = `${Math.random()*8+3}px`;
        particle.style.height = particle.style.width;
        particle.style.borderRadius = "50%";
        particle.style.left = "50%";
        particle.style.top = "45%";
        particle.style.background = ["#ffdd44","#ff4488","#44ddff","#88ff44","#bb66ff"][Math.floor(Math.random()*5)];
        particle.style.opacity = "0.9";
        const angle = Math.random() * Math.PI *2;
        const speed = Math.random()*180+80;
        const endX = Math.cos(angle)*speed;
        const endY = Math.sin(angle)*speed;
        particle.animate([
            {transform:"translate(0,0) scale(1)",opacity:1},
            {transform:`translate(${endX}px,${endY}px) scale(0)`,opacity:0}
        ],{
            duration: 1200,
            easing:"ease-out"
        });
        fireworkBox.appendChild(particle);
        setTimeout(()=>particle.remove(),1200);
    }
}

//普通日志
function addNormalLog(text){
    const div = document.createElement("div");
    div.className = "normal-log";
    div.innerText = text;
    logBox.appendChild(div);
    logBox.scrollTop = logBox.scrollHeight;
}
//中奖弹跳日志
function addPrizeLog(text){
    const div = document.createElement("div");
    div.className = "prize-item";
    div.innerText = text;
    logBox.appendChild(div);
    logBox.scrollTop = logBox.scrollHeight;
}

//领取猴子币
gainBtn.addEventListener("click",()=>{
    coins +=1;
    addNormalLog("✅ 获取1枚猴子币");
    updateUI();
})

//抽奖逻辑
lotteryBtn.addEventListener("click",async ()=>{
    if(coins <1 || lotteryBtn.classList.contains("shake-running")) return;

    coins -=1;
    lotteryBtn.classList.add("shake-running");
    lotteryBtn.disabled = true;
    addNormalLog("🎲抽奖进行中……");

    await sleep(1100);

    lotteryBtn.classList.remove("shake-running");
    const idx = Math.floor(Math.random() * prizeList.length);
    const winPrize = prizeList[idx];

    addPrizeLog(`🎉恭喜！抽中【${winPrize}】`);
    createFirework(); //播放礼花
    updateUI();
})

updateUI();
</script>
</body>
</html>
