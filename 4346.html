<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猴子币系统</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            max-width: 420px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f7f7f7;
        }
        .box {
            background: #fff;
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 2px 12px #00000018;
        }
        h1 {
            text-align: center;
            font-size: 22px;
            margin-top:0;
        }
        .balance {
            font-size: 18px;
            text-align:center;
            margin:16px 0;
        }
        button {
            width:100%;
            padding:12px;
            font-size:16px;
            border:none;
            border-radius:8px;
            margin:8px 0;
            cursor:pointer;
        }
        .get-btn {
            background:#ff9500;
            color:white;
        }
        .exchange-btn {
            background:#2563eb;
            color:white;
        }
        .exchange-btn:disabled {
            background:#94a3b8;
            cursor:not-allowed;
        }
        .log-area {
            margin-top:20px;
            border:1px solid #ddd;
            padding:12px;
            border-radius:8px;
            min-height:100px;
        }
    </style>
</head>
<body>
<div class="box">
    <h1>🐒猴子币</h1>
    <div class="balance">猴子币余额：<span id="coinNum">0</span></div>

    <button class="get-btn" id="getCoinBtn">点击获得1个猴子币</button>

    <hr>
    <p>消耗1猴子币兑换奖励：</p>

    <button class="exchange-btn" data-item="mj">兑换 mj</button>
    <button class="exchange-btn" data-item="狗屎">兑换 狗屎</button>
    <button class="exchange-btn" data-item="特啷浦的裤衩">兑换 特啷浦的裤衩</button>

    <div class="log-area" id="logBox"></div>
</div>

<script>
// 读取本地存储猴子币
let coins = Number(localStorage.getItem("monkeyCoin")) || 0;
const coinEl = document.getElementById("coinNum");
const logBox = document.getElementById("logBox");
const getCoinBtn = document.getElementById("getCoinBtn");
const exchangeBtns = document.querySelectorAll(".exchange-btn");

function render() {
    coinEl.innerText = coins;
    exchangeBtns.forEach(btn=>{
        btn.disabled = coins < 1;
    })
    localStorage.setItem("monkeyCoin", coins);
}

// 获取猴子币
getCoinBtn.addEventListener("click", ()=>{
    coins += 1;
    addLog("✅ 获取 1 猴子币");
    render();
})

//兑换
exchangeBtns.forEach(btn=>{
    btn.addEventListener("click", ()=>{
        if(coins >=1){
            coins -=1;
            const item = btn.dataset.item;
            addLog(`🎁 使用1猴子币兑换：${item}`);
            render();
        }
    })
})

function addLog(text){
    const div = document.createElement("div");
    div.innerText = text;
    logBox.appendChild(div);
    logBox.scrollTop = logBox.scrollHeight;
}

render();
</script>
</body>
</html>
